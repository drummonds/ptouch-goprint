# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  release:
    desc: 'Release process eg task release VERSION=v0.22.1 COMMENT="fix jobs"'
    requires:
      vars: [VERSION, COMMENT]
    cmds:
      # - task: clean:all
      # - task: build
      - task: check
      - git add .
      - git commit -am "{{.COMMENT}}"
      - git tag "{{.VERSION}}"
      - git push origin "{{.VERSION}}"
      - git push
      - goreleaser release --clean
      - go install github.com/drummonds/ptouch-goprint/cmd/ptouch-goprint@latest

  install:
    desc: Install locally to $GOPATH/bin
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
    cmds:
      - go install -ldflags "-X main.version={{.VERSION}}" ./cmd/ptouch-goprint

  check:
    desc: Run all checks (fmt, vet, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test

  # Code quality tasks
  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run Go linter (requires golangci-lint)
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  # Test tasks
  test:
    desc: Run all Go tests
    cmds:
      - go test -v ./...